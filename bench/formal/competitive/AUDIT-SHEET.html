<html lang="en">

<title>OOH 160-claim audit</title>
<style>
  :root { --bg:#0f172a; --card:#16213a; --text:#e6edf7; --muted:#93a4c3;
          --good:#1f9d63; --bad:#c0392b; --warn:#b7791f; --line:#263451; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:2; background:#0b1222; border-bottom:1px solid var(--line);
           padding:14px 20px; }
  h1 { font-size:18px; margin:0 0 8px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { border:1px solid var(--line); background:#1b2742; color:var(--text);
           border-radius:8px; padding:7px 11px; cursor:pointer; font-size:14px; }
  button:hover { background:#23345a; }
  button.good { background:var(--good); border-color:var(--good); }
  button.bad { background:var(--bad); border-color:var(--bad); }
  button.warn { background:var(--warn); border-color:var(--warn); }
  button.ghost { background:transparent; }
  .progress { height:8px; background:#1b2742; border-radius:99px; overflow:hidden; margin:10px 0; }
  .progress > div { height:100%; width:0; background:linear-gradient(90deg,#2f80ed,#56ccf2); }
  main { max-width:1100px; margin:0 auto; padding:18px 20px 80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin:14px 0; }
  .card.reviewed { border-color:#2f6f4f; }
  .meta { display:flex; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:13px; margin-bottom:8px; }
  .pill { border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
  .pill.required { border-color:#b7791f; color:#f6c177; }
  .q { font-weight:600; margin:8px 0; }
  .a { background:#0f1a30; border-left:3px solid #2f80ed; padding:9px 12px; border-radius:6px; }
  .evidence { margin-top:10px; color:var(--muted); }
  details { margin-top:8px; }
  pre { white-space:pre-wrap; word-break:break-word; background:#0b1222; border:1px solid var(--line);
        border-radius:8px; padding:10px; max-height:340px; overflow:auto; font-size:13px; }
  textarea { width:100%; min-height:44px; margin-top:8px; background:#0b1222; color:var(--text);
             border:1px solid var(--line); border-radius:8px; padding:8px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .small { color:var(--muted); font-size:12px; }
  .counts { color:var(--muted); font-size:13px; margin-left:auto; }
  @media (max-width:700px) { main { padding:12px; } .card { padding:12px; } }
</style>

ms that impact students’ learning. They may design and implement performance plans, evaluate performance, and counsel students and families. They may consult with\nteachers\n, administrators, and other educators.\nOther psychologists\ninclude\nforensic psychologists\n, who work with\njudges\n,\nattorneys\n, and related specialists to understand the psychological aspects of a legal case;\nneuropsychologists\n, who study how dysfunction or damage to the brain, spine, or nerves affects behavior and cognition; and\nrehabilitation psychologists\n, who help foster independence in clients who have physical or developmental disabilities due to illness or injury.\nPsychologists are among several specialists who focus on mental and behavioral health. For more information about some of these specialists, see the profiles on psychia", "audit_required": "yes"}, {"id": "test-003-absent", "question": "What is the median annual pay for Information Security Analysts in New York?", "category": "absence", "answer": "NOT FOUND — the corpus does not state the requested fact.", "gold": "absent", "evidence": "# Information Security Analysts\n\n## Quick Facts\nQuick Facts: Information Security Analysts\n2023 Median Pay | $120,360 per year $57.87 per hour\nTypical Entry-Level Education | Bachelor's degree\nWork Experience in a Related Occupation | Less than 5 years\nOn-the-job Training | None\nNumber of Jobs, 2023 | 180,700\nJob Outlook, 2023-33 | 33% (Much faster than average)\nEmployment Change, 2023-33 | 59,100\n\n## What Information Security Analysts Do\nInformation security analysts install software, such as firewalls, to protect computer networks.\nInformation security analysts plan and carry out security measures to protect an organization’s computer networks and systems.\nDuties\nInformation security analysts typically do the following:\nMonitor their organization’s networks for security breaches and investigate when one occurs\nUse and maintain software, such as firewalls and data h school diploma or equivalent\nWork Experience in a Related Occupation | None\nOn-the-job Training | Short-term on-the-job training\nNumber of Jobs, 2023 | 970,800\nJob Outlook, 2023-33 | -1% (Decline)\nEmployment Change, 2023-33 | -13,000\n\n## What Childcare Workers Do\nChildcare workers prepare and organize mealtimes and snacks for children.\nChildcare workers attend to children's needs while helping to foster early development. They may help younger children prepare for kindergarten or assist older children with homework.\nDuties\nChildcare workers typically do the following:\nSupervise and monitor the safety of children\nPrepare and organize mealtimes and snacks for children\nHelp children keep good hygiene\nChange the diapers of infants and toddlers\nOrganize activities or implement a curriculum that allows children to learn about the world and explore their interests\nDevelop schedules and routines to ensure that children have enough physical activity, rest, and playtime\nWatch for signs of emotional or developmental problems in children and bring potential problems to the attention of parents or guardians\nKeep records of children’s progress, routines, and interests\nChildcare workers read and play with babies and toddlers to introduce basic concepts. For example, they teach them how to share and take turns by playing games with other children.\nChildcare workers help preschool-age children prepare for kindergarten. Young children learn from playing, questioning, and experimenting. Childcare workers use play and other instructional techniques to help children’s development. For example, they may use storytelling and rhyming games to teach language and vocabulary. They may help improve children’s social skills by having them work together to build something in a sandbox. Or they may teach about numbers by having children count when building with blocks. They also involve children in creative activities, such as art, dance, and music.\nChildcare workers may a or example, they may use storytelling and rhyming games to teach language and vocabulary. They may help improve children’s social skills by having them work together to build something in a sandbox. Or they may teach about numbers by having children count when building with blocks. They also involve children in creative activities, such as art, dance, and music.\nChildcare workers may also watch school-age children before and after school. They often help these children with their homework and may take them to afterschool activities, such as sports practices and club meetings.\nDuring the summer, when children are out of school, childcare workers may watch older children as well as younger ones while the parents are at work.\nThe following are examples of types of childcare workers:\nChildcare center workers\nwork in facilities that include programs offering Head Start and Early Head Start. They often take a team-based approach and may work with\npreschool teachers\nand\nteacher assistants\nto teach children through a structured curriculum. They prepare daily and long-term schedules of activities to stimulate and educate the children in their care. They also monitor and keep records of the children’s progress.\nFamily childcare providers\nrun a business out of their own homes to care for children during standard working hours. They need to ensure that their homes and all staff they employ meet the regulations for family childcare providers. They also prepare contracts that set rates of pay, when payment can be expected, and the number of hours children can be in care. Furthermore, they establish policies such as whether sick children can be in their care, who can pick children up, and how behavioral issues will be dealt with. Family childcare providers may market their services to prospective families.\nNannies\nwork in the homes of the families whose children they care for. Most often, they work full time for one family. They may be responsible for driving children uties\nFinancial analysts typically do the following:\nRecommend individual investments and collections of investments, known as portfolios\nEvaluate current and historical financial data\nStudy economic and business trends\nExamine a company’s financial statements to determine its value\nMeet with company officials to gain better insight into the company’s prospects\nAssess the strength of the management team\nPrepare written reports\nFinancial analysts evaluate opportunities to commit money for the purpose of generating profit.\nFinancial analysts can be divided into two categories: buy-side analysts and sell-side analysts.\nBuy-side analysts develop investment strategies for companies that have a lot of money to invest. These companies, called institutional investors, include hedge funds, insurance companies, independent money managers, nonprofit organizations with large endowments, private equity firms, and pension funds.\nSell-side analysts advise financial services sales agents who sell stocks, bonds, and other investments.\nAnalysts may work for the business media or other research houses, which are independent from the buy and sell side.\nFinancial analysts generally focus on trends affecting a specific geographical region, industry, or type of product. For example, they may focus on a subject area or a foreign exchange market. They must understand how economic trends, new regulations, policies, and political situations may affect investments.\nInvesting has become more global, and some specialize in a particular country or world region. Companies want these specialists to understand the business environment, culture, language, and political conditions in the country or region that they cover.\nThe following are examples of types of financial analysts:\nFinancial risk specialists\n, also called\nfinancial risk analysts\n, evaluate threats to investment decisions and determine how to manage unpredictability and limit potential losses. They make investment decisions such as selecting dissimilar stocks or having a combination of stocks, bonds, and mutual funds in a portfolio. They also make recommendations to limit risk.\nFund managers\nwork exclusively with hedge funds or mutual funds. Both fund managers and portfolio managers frequently make buy or sell decisions in reaction to quickly changing market conditions.\nInvestment analysts\nassess information involving investment programs or financial data of institutions, such as business valuation. They also respond to queries from clients and client advisors regarding asset allocation and alternative investment topics including hedge funds, real property, and venture capital.\nPortfolio managers\nselect the mix of products, industries, and regions for their company’s investment portfolio. These managers are responsible for the overall performance of the portfolio. They are also expected to explain investment decisions and strategies in meetings with stakeholders.\nRatings analysts\nevaluate the ability of companies or governments to pay their debts, including bonds. Based on these evaluations, a management team rates the risk of a company or government not being able to repay its bonds.\nSecurities analysts\nevaluate securities markets and trends to identify high-yield assets for clients and companies. They may use resources such as bond perfor", "audit_required": "no"}, {"id": "test-019-contradicted", "question": "What is the combined 2023 employment of Financial Analysts and Customer Service Representatives?", "category": "sum", "answer": "The combined 2023 employment is 3,360,400.", "gold": "contradicted", "evidence": "# Financial Analysts\n\n## Quick Facts\nQuick Facts: Financial Analysts\n2023 Median Pay | $99,890 per year $48.02 per hour\nTypical Entry-Level Education | Bachelor's degree\nWork Experience in a Related Occupation | None\nOn-the-job Training | None\nNumber of Jobs, 2023 | 404,800\nJob Outlook, 2023-33 | 9% (Much faster than average)\nEmployment Change, ": "supported", "evidence": "# Barbers, Hairstylists, and Cosmetologists\n\n## Quick Facts\nQuick Facts: Barbers, Hairstylists, and Cosmetologists\n2023 Median Pay | $35,080 per year $16.87 per hour\nTypical Entry-Level Education | Postsecondary nondegree award\nWork Experience in a Related Occupation | None\nOn-the-job Training | None\nNumber of Jobs, 2023 | 649,400\nJob Outlook, 2023-33 | 7% (Faster than average)\nEmployment Change, 2023-33 | 45,300\n\n## What Barbers, Hairstylists, and Cosmetologists Do\nHairstylists provide hair styling and beauty services.\nBarbers, hairstylists, and cosmetologists provide haircutting, hairstyling, and other services related to personal appearance.\nDuties\nBarbers, hairstylists, and cosmetologists typically do the following:\nInspect and analyze hair, scalp, and skin to recommend services or treatment\nDiscuss hairstyle options\nShampoo, color, lighten, and condition hair\nChemically change hair texture\nCut, dry, and style hair\nTrim facial hair\nReceive payments from client\nClean and disinfect all tools and work areas\nBarbers, hairstylists, and cosmetologists provide hair and other services to enhance clients’ appearance. Common tools may include combs and hairbrushes, clippers and scissors, straight razors, blow dryers, and curling and flat irons. They also may keep records of products used and services provided to clients, such as hair color, hair treatment, and clipper setting.\nThose who operate their own barbershop or salon have managerial duties that may include hiring, supervising, and firing workers. They also may keep business and inventory records, order supplies, and arrange for advertising.\nBarbers\nshampoo, cut, and style hair, mostly for male clients. They also may fit hairpieces, provide facials, trim beards and mustaches, and offer facial and head shaving. Depending on the state in which they work, some barbers are licensed to bleach, color, and highlight hair and to offer permanent-wave services.\nHairstylists\nand cosmetologists\noffer a wide range of hair services, such as shampooing, cutting, coloring, and styling. They often provide consultation and advise clients on how to care for their hair at home. Some also clean and style wigs and hairpieces.\nHairstylists and cosmetologists also provide facial and scalp treatments, makeup analysis, and skincare and nail services. In addition, some recommend hair care or skincare products. For more information about workers who specialize in skincare treatment or in fingernail and toenail services, see the profiles for\nskincare specialists\nor\nmanicurists and pedicurists\n, respectively.\n\n## Work Environment\nBarbers usually work in barbershops and must stand for long periods.\nBarbers held about 78,400 jobs in 2023. The largest employers of barbers were as follows:\nSelf-employed workers\n80%\nPersonal care services\n19\nHairdressers, hairstylists, and cosmetologists held about 571,100 jobs in 2023. The largest employers of hairdressers, hairstylists, and cosmetologists were as follows:\nSelf-employed workers\n48%\nPersonal care services\n46\nRetail trade\n4\nBarbers, hairstylists, and cosmetologists work mostly in barbershops or salons, although some work in spas, hotels, or resorts. Some lease booth space from a salon owner. Others manage salons or open their own shop after several years of gaining experience.\nBarbers, hairstylists, and cosmetologists usually work in pleasant surroundings with good lighting. Physical stamina is important because they are on their feet for most of their shift. Prolonged exposure to some chemicals may cause skin irritation, so they often wear protective clothing, such as disposable gloves or aprons.\nWork Schedules\nMost barbers, hairstylists, and cosmetologists are full time, although part-time work is common. Work schedules may vary and often include evenings and weekends—times when barbershops and beauty salons may be busiest. Those who are self-employed and operate their own barbershop or salon may have long workdays, but they usually determine their own schedul", "audit_required": "yes"}, {"id": "test-020-contradicted", "question": "What is the projected percent growth for Barbers, Hairstylists, and Cosmetologists from 2023 to 2033?", "category": "lookup", "answer": "The projected growth rate for Barbers, Hairstylists, and Cosmetologists from 2023 to 2033 is 8%.", "gold": "contradicted", "evidence": "# Barbers, Hairstylists, and Cosmetologists\n\n## Quick Facts\nQuick Facts: Barbers, Hairstylists, and Cosmetologists\n2023 Median Pay | $35,080 per year $16.87 per hour\nTypical Entry-Level Education | Postsecondary nondegree award\nWork Experience in a Related Occupation | None\nOn-the-job Training | None\nNumber of Jobs, 2023 | 649,400\nJob Outlook, 2023-33 | 7% (Faster than average)\nEmployment Change, 2023-33 | 45,300\n\n## What Barbers, Hairstylists, and Cosmetologists Do\nHairstylists provide hair styling and beauty services.\nBarbers, hairstylists, and cosmetologists provide haircutting, hairstyling, and other services related to personal appearance.\nDuties\nBarbers, hairstylists, and cosmetologists typically do the following:\nInspect and analyze hair, scalp, and skin to recommend services or treatment\nDiscuss hairstyle options\nShampoo, color, lighten, and condition hair\nChemically change hair texture\nCut, dry, and style hair\nTrim facial hair\nReceive payments from client\nClean and disinfect all tools and work areas\nBarbers, hairstylists, and cosmetologists provide hair and other services to enhance clients’ appearance. Common tools may include combs and hairbrushes, clippers and scissors, straight razors, blow dryers, and curling and flat irons. They also may keep records of products used and services provided to clients, such as hair color, hair treatment, and clipper setting.\nThose who operate their own barbershop or salon have managerial duties that may include hiring, supervising, and firing workers. They also may keep b ain profit. They assess the performance of stocks, bonds, and other types of investments.\nDuties\nFinancial analysts typically do the following:\nRecommend individual investments and collections of investments, known as portfolios\nEvaluate current and historical financial data\nStudy economic and business trends\nExamine a company’s financial statements to determine its value\nMeet with company officials to gain better insight into the company’s prospects\nAssess the strength of the management team\nPrepare written reports\nFinancial analysts evaluate opportunities to commit money for the purpose of generating profit.\nFinancial analysts can be divided into two categories: buy-side analysts and sell-side analysts.\nBuy-side analysts develop investment strategies for companies that have a lot of money to invest. These companies, called institutional investors, include hedge funds, insurance companies, independent money managers, nonprofit organizations with large endowments, private equity firms, and pension funds.\nSell-side analysts advise financial services sales agents who sell stocks, bonds, and other investments.\nAnalysts may work for the business media or other research houses, which are independent from the buy and sell side.\nFinancial analysts generally focus on trends affecting a specific geographical region, industry, or type of product. For example, they may focus on a subject area or a foreign exchange market. They must understand how economic trends, new regulations, policies, and political situations may affect investments.\nInvesting has become more global, and some specialize in a particular country or world region. Companies want these specialists to understand the business environment, culture, language, and political conditions in the country or region that they cover.\nThe following are examples of types of financial analysts:\nFinancial risk specialists\n, also called\nfinancial risk analysts\n, evaluate threats to investment decisions and d e information about some of these specialists, see the profiles on psychia", "audit_required": "no"}, {"id": "test-026-contradicted", "question": "What is the median annual pay for Psychologists in Phoenix?", "category": "absence", "answer": "The median annual pay in phoenix is $100,000.", "gold": "contradicted", "evidence": "# Psychologists\n\n## Quick Facts\nQuick Facts: Psychologists\n2023 Median Pay | $92,740 per year $44.59 per hour\nTypical Entry-Level Education | See How to Become One\nWork Experience in a Related Occupation | None\nOn-the-job Training | Internship/residency\nNumber of Jobs, 2023 | 207,500\nJob Outlook, 2023-33 | 7% (Faster than average)\nEmployment Change, 2023-33 | 14,000\n\n## What Psychologists Do\nIndustrial-organizational psychologists apply psychological research and methods to workplace issues.\nPsychologists study cognitive, emotional, and social processes and behavior by observing, interpreting, and recording how people relate to one another and to their environments. They use their findings to help improve processes and behaviors.\nDuties\nPsychologists typically do the following:\nStudy behavior and brain function by observing, interviewing, and surveying individuals\nIdentify psychological, emotional, behavioral, or organizational issues and diagnose disorders\nResearch and identify behavioral or emotional issues, such as anxiety and depression\nTest for patterns that will help them better understand and predict behavior\nDiscuss the results of testing with clients or their families and, if needed, develop treatment plans\nWrite articles, research papers, and reports to share findings\nPsychologists seek to understand and explain thoughts, emotions, and behavior. Through techniques such as observation, assessment, and experimentation, they try to gain a better understanding about how beliefs and feelings influence people.\nPsychologists often gather information and evaluate behavior through controlled laboratory experiments, psychoanalysis, or psychotherapy. They may administer personality, performance, aptitude, or intelligence tests. They look for patterns of behavior or relationships between events, and they use this information in their research or when treating clients.\nThe following are examples of types of psychologists:\nClinical and counseling psychologists\nassess, diagnose, and treat mental, emotional, and behavioral disorders. They help people deal with problems ranging from everyday issues to severe, chronic conditions.\nClinical and counseling psychologists typically interview clients, administer diagnostic tests, and provide psychotherapy to individuals, families, and groups. They help clients identify their strengths and available resources to prevent or manage problems, and they design behavior modification plans that they help clients to implement.\nClinical and counseling psychologists sometimes work with a specific population, such as older people, or focus on a specific condition, such as cognitive disorders. Some states permit clinical psychologists to prescribe medication.\nIndustrial–organizational psychologists\napply psychological principles to solve workplace problems and improve work-life quality. They study issues such as productivity, employee testing and selection, and organizational dynamics. They may work closely with\ntop executives\n,\ntraining and development managers\n, and\ntraining and development specialists\n.\nSchool psychologists\nstudy strategies to address educational, behavioral, or developmental problems that impact students’ learning. They may design and implement performance plans, evaluate performance, and counsel students and families. They may consult with\nteachers\n, administrators, and other educators.\nOther psychologists\ninclude\nforensic psychologists\n, who work with\njudges\n,\nattorneys\n, and related specialists to understand the psychological aspects of a legal case;\nneuropsychologists\n, who study how dysfunction or damage t re for problems. As part of their testing, these workers document and track the software’s potential defects or risks. They also assess its usability and functionality to identify difficulties a user might have. After completing testing, they report the results to software or\nweb developers\nand review ways to solve any problems they found.\nAfter the program is released to the customer, a developer may perform upgrades and maintenance. Quality assurance analysts and testers run manual and automated checks to look for errors and usability problems once the software is released and after any upgrades or maintenance.\nThe following are examples of types of software developers:\nApplications software developers\ndesign computer applications, such as games, for consumers. They may create custom software for a specific customer or commercial software to be sold to the general public. Some applications software developers create databases or programs for use internally or online.\nSoftware engineers\ntake a broad view of a project’s system and software requirements, planning its scope and order of work. These workers may direct software developers, quality assurance analysts, and testers.\nSystems software developers\ncreate the operating systems for the public or specifically for an organization. These operating systems keep computers functioning and control most of the consumer electronics in use today, including t", "audit_required": "yes"}, {"id": "test-053-supported", "question": "Which has the higher projected growth rate, Machinists and Tool and Die Makers or Heating, Air Conditioning, and Refrigeration Mechanics and Installers, and by how many percentage points?", "category": "compare", "answer": "Heating, Air Conditioning, and Refrigeration Mechanics and Installers has the higher value: 9% compared with 0% for Machinists and Tool and Die Makers. The difference is 9%.", "gold": "supported", "evidence": "# Machinists and Tool and Die Makers\n\n## Quick Facts\nQuic ed, and feed rate.\nAlthough workers may produce large quantities of one part, precision machinists often produce small batches or single items. The parts that machinists make include steel bolts, titanium bone screws, and automobile pistons.\nSome machinists repair broken parts or make new parts that an\nindustrial machinery mechanic\ndiscovers in a machine. The machinist refers to engineering drawings to create the replacement.\nSome manufacturing processes use lasers, water jets, and electrified wires to cut the workpiece. As\nengineers\ndesign and build new types of machine tools, machinists must learn new machining properties and techniques.\nTool and die makers\nconstruct precision tools or metal forms, called dies, that are used to cut, shape, and mold metal, plastics, and other materials.\nTool and die makers use CAD to develop products and parts. They enter designs into computer programs that produce blueprints for the required tools and dies. CNC programmers, described in the\nmetal and plastic machine workers\nprofile, convert CAD designs into CAM programs that contain instructions for a sequence of cutting-tool operations. Machinists normally operate CNC machines, but tool and die makers often are trained to both operate CNC machines and write CNC programs and thus may do either task.\n\n## Work Environment\nSome machinists and tool and die makers work evenings and weekends because facilities may operate around the clock.\nMachinists held about 298,000 jobs in 2023. The largest employers of machinists were as follows:\nFabricated metal product manufacturing\n35%\nMachinery manufacturing\n19\nTransportation equipment manufacturing\n12\nWholesale trade\n4\nEmployment services\n3\nTool and die makers held about 59,100 jobs in 2023. The largest employers of tool and die makers were as follows:\nTransportation equipment manufacturing\n26%\nMachinery manufacturing\n22\nFabricated metal product manufacturing\n21\nPrimary metal manufacturing\n7\nPlastics product const KEY = "formal-audit-ooh-160-claim-audit";
const VERDICTS = ["correct", "incorrect", "ambiguous", "skip"];
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
let filter = "required";
let current = 0;

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
  renderCounts();
  render();
}

function matches(row) {
  if (filter === "all") return true;
  if (filter === "required") return row.audit_required === "yes";
  if (filter === "unreviewed") return !state[row.id];
  if (filter === "contradicted") return row.gold === "contradicted";
  if (filter === "supported") return row.gold === "supported";
  if (filter === "absent") return row.gold === "absent";
  return true;
}

function renderCounts() {
  const total = DATA.length;
  const required = DATA.filter(r => r.audit_required === "yes").length;
  const reviewed = DATA.filter(r => state[r.id]).length;
  const correct = DATA.filter(r => state[r.id]?.verdict === "correct").length;
  const incorrect = DATA.filter(r => state[r.id]?.verdict === "incorrect").length;
  const ambiguous = DATA.filter(r => state[r.id]?.verdict === "ambiguous").length;
  document.getElementById("counts").textContent =
    `${reviewed}/${total} reviewed · ${correct} correct · ${incorrect} incorrect · ${ambiguous} ambiguous · ${required} required`;
  const pct = total ? Math.round(100 * reviewed / total) : 0;
  document.getElementById("progress").style.width = pct + "%";
}

function render() {
  const cards = document.getElementById("cards");
  cards.innerHTML = "";
  const rows = DATA.filter(matches);
  rows.forEach((row, idx) => {
    const card = document.createElement("section");
    card.className = "card" + (state[row.id] ? " reviewed" : "");
    card.dataset.id = row.id;
    const meta = document.createElement("div");
    meta.className = "meta";
    const pills = [
      row.id,
      row.category,
      `gold: ${row.gold}`,
      row.formal_verdict ? `formal: ${row.formal_verdict}` : null,
      row.condition ? row.condition : null,
    ].filter(Boolean);
    pills.forEach(t => {
      const s = document.createElement("span");
      s.className = "pill";
      s.textContent = t;
      meta.appendChild(s);
    });
    if (row.audit_required === "yes") {
      const s = document.createElement("span");
      s.className = "pill required";
      s.textContent = "audit required";
      meta.appendChild(s);
    }
    card.appendChild(meta);

    const q = document.createElement("div");
    q.className = "q";
    q.textContent = row.question;
    card.appendChild(q);

    const a = document.createElement("div");
    a.className = "a";
    a.textContent = row.answer;
    card.appendChild(a);

    const ev = document.createElement("div");
    ev.className = "evidence";
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = `Evidence (${String(row.evidence || "").length} chars)`;
    det.appendChild(sum);
    const pre = document.createElement("pre");
    pre.textContent = String(row.evidence || "").slice(0, 5000);
    det.appendChild(pre);
    ev.appendChild(det);
    card.appendChild(ev);

    const actions = document.createElement("div");
    actions.className = "actions";
    const labels = {correct: "Correct", incorrect: "Incorrect", ambiguous: "Ambiguous", skip: "Skip"};
    VERDICTS.forEach(v => {
      const b = document.createElement("button");
      b.textContent = labels[v];
      b.className = v === "correct" ? "good" : v === "incorrect" ? "bad" : v === "ambiguous" ? "warn" : "ghost";
      if (state[row.id]?.verdict === v) b.style.outline = "2px solid #fff";
      b.onclick = () => {
        state[row.id] = {...(state[row.id] || {}), verdict: v};
        save();
      };
      actions.appendChild(b);
    });
    card.appendChild(actions);

    const notes = document.createElement("textarea");
    notes.placeholder = "Notes (optional)";
    notes.value = state[row.id]?.notes || "";
    notes.oninput = () => {
      state[row.id] = {...(state[row.id] || {}), notes: notes.value};
      localStorage.setItem(KEY, JSON.stringify(state));
    };
    card.appendChild(notes);

    cards.appendChild(card);
  });
}

function exportJSON() {
  const payload = {
    title: "OOH 160-claim audit",
    exported_at: new Date().toISOString(),
    results: DATA.map(r => ({
      id: r.id, category: r.category, question: r.question, answer: r.answer,
      gold: r.gold, provisional_gold: r.provisional_gold || null,
      formal_verdict: r.formal_verdict || null,
      verdict: state[r.id]?.verdict || null,
      notes: state[r.id]?.notes || "",
    })),
  };
  download("audit-results.json", JSON.stringify(payload, null, 2), "application/json");
}

function exportCSV() {
  const head = ["id","category","gold","verdict","notes","question","answer"];
  const esc = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [head.map(esc).join(",")];
  DATA.forEach(r => lines.push([
    r.id, r.category, r.gold, state[r.id]?.verdict || "", state[r.id]?.notes || "",
    r.question, r.answer,
  ].map(esc).join(",")));
  download("audit-results.csv", lines.join("\n"), "text/csv");
}

function download(name, text, type) {
  const blob = new Blob([text], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("export-json").onclick = exportJSON;
document.getElementById("export-csv").onclick = exportCSV;
document.getElementById("reset").onclick = () => {
  if (confirm("Reset all audit decisions?")) { state = {}; save(); }
};
document.getElementById("import").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      (payload.results || []).forEach(r => {
        if (r.verdict) state[r.id] = {verdict: r.verdict, notes: r.notes || ""};
      });
      save();
    } catch (err) { alert("Invalid JSON: " + err.message); }
  };
  reader.readAsText(file);
};
document.querySelectorAll("[data-filter]").forEach(b => {
  b.onclick = () => { filter = b.dataset.filter; current = 0; render(); };
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const rows = DATA.filter(matches);
  const row = rows[current];
  if (!row) return;
  const map = {"1":"correct","2":"incorrect","3":"ambiguous","4":"skip"};
  if (map[e.key]) {
    state[row.id] = {...(state[row.id] || {}), verdict: map[e.key]};
    save();
    current = Math.min(current + 1, rows.length - 1);
  }
});
renderCounts();
render();
</script>
