# Offline verification job — ships to .github/workflows/offline.yml (export DEST).
# Runs in the public repo only: asserts every [recomputed] article cell against
# the committed, sha256-pinned artifacts, then the kit's pure-logic suite.
# No install step: the exported package ships zero dependencies.

name: Offline verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Article cells + corpus manifest reproduce from committed artifacts
        run: node verify-offline.mjs

      - name: Kit suite (pure logic — no model, no network)
        run: npm run kit:test

      - name: Traceability (the battery's published-number map)
        run: npm run traceability

      - name: Baselines (gate vs cheap alternatives at matched coverage)
        run: node bench/hotpot-baselines.mjs

      - name: Kit coverage (floor enforced)
        run: npm run kit:coverage

  kit-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 18

      - name: Kit suite on Node 18 (the package's engines floor)
        run: npm run kit:test
